services:
  jellyfin:
    image: jellyfin/jellyfin:12
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"   # HTTP web UI + API
    volumes:
      # The media library
      - D:/NoCopyrightMedia/media:/media
      # Local plugin dev — drop JellyPlay plugin build output here, restart container
      - D:/NoCopyrightMedia/plugins:/config/plugins
      # Server config/metadata/cache kept in named volumes so they survive upgrades
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    environment:
      # Publishing/DLNA discovery on the LAN
      - JELLYFIN_PublishedServerUrl=http://localhost:8096

  # One-shot: completes Jellyfin's first-run wizard so the server comes up
  # with admin/admin. Test setup only — change before exposing beyond localhost.
  jellyfin-setup:
    image: curlimages/curl:latest
    container_name: jellyfin-setup
    depends_on:
      - jellyfin
    restart: "no"
    volumes:
      - ./tools/jellyfin-init.sh:/init-admin.sh:ro
    environment:
      - JELLYFIN_ADMIN_USER=admin
      - JELLYFIN_ADMIN_PASS=admin
    entrypoint: ["/bin/sh", "/init-admin.sh"]

volumes:
  jellyfin-config:
  jellyfin-cache:
